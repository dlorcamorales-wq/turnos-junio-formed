  return `<table><thead><tr><th>Día</th><th>Horario</th><th>Sede</th><th>Box</th></tr></thead><tbody>${turnos.map(t => `<tr><td>${escapeHtml(t.Día)}</td><td>${escapeHtml(t.Horario)}</td><td>${escapeHtml(t.Sede)}</td><td>${escapeHtml(t.Box)}</td></tr>`).join('')}</tbody></table>`;
}
function render() {
  const term = normalize(q.value);
  if (!term) {
    results.innerHTML = `<div class="empty">Ingrese un nombre o apellido para ver los turnos.</div>`;
    return;
  }
  const matches = DATA.filter(item => item.search.includes(term));
  if (!matches.length) {
    results.innerHTML = `<div class="empty">No encontré turnos para esa búsqueda.</div>`;
    return;
  }
  results.innerHTML = matches.map(item => `<article class="card"><h2>${escapeHtml(item.name)}</h2>${table(item.turnos)}</article>`).join('');
}
q.addEventListener('input', render);
document.getElementById('clear').addEventListener('click', () => { q.value = ''; q.focus(); render(); });
render();
</script>
</body>
</html>
