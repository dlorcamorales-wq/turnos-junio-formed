<style>
:root {

  --brand: #00a6a6;
  --brand-dark: #05747d;
  --accent: #f28c38;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; color: var(--ink); background: #f4f8f8; }
.shell { max-width: 900px; margin: 0 auto; padding: 40px 22px 56px; }
.hero { background: linear-gradient(135deg, var(--brand-dark), var(--brand)); color: #fff; padding: 30px; border-radius: 8px; margin-bottom: 18px; }
.brand { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; opacity: .92; }
h1 { margin: 8px 0 0; font-size: 30px; line-height: 1.15; }
.search { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
label { display: block; font-weight: 700; margin-bottom: 8px; color: var(--brand-dark); }
.row { display: flex; gap: 10px; }
input { width: 100%; border: 1px solid #bdd3d7; border-radius: 6px; padding: 13px 14px; font-size: 16px; color: var(--ink); outline: none; }
input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(0,166,166,.16); }
button { border: 0; border-radius: 6px; padding: 0 18px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
button:hover { filter: brightness(.96); }
.hint { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
.results { margin-top: 18px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 8px; margin: 14px 0; overflow: hidden; }
.card h2 { margin: 0; padding: 14px 16px; background: var(--soft); border-bottom: 1px solid var(--line); font-size: 18px; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { background: #f9fcfc; color: var(--brand-dark); text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); padding: 10px 12px; }
td { border-top: 1px solid var(--line); padding: 11px 12px; font-size: 13px; vertical-align: top; }
tr:nth-child(even) td { background: var(--soft2); }
.empty { background: #fff; border: 1px dashed #bdd3d7; border-radius: 8px; color: var(--muted); padding: 16px; }
@media (max-width: 640px) { .row { flex-direction: column; } button { height: 44px; } h1 { font-size: 24px; } }
</style>
</head>

const input = document.getElementById('q');
const button = document.getElementById('btn');
const results = document.getElementById('results');

function normalize(text) {
  return String(text || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}

function escapeHtml(text) {
  return String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function table(turnos) {
  const rows = turnos.map(t => `
    <tr>
      <td>${escapeHtml(t.Día)}</td>
      <td>${escapeHtml(t.Horario)}</td>
      <td>${escapeHtml(t.Sede)}</td>
      <td>${escapeHtml(t.Box)}</td>
    </tr>
  `).join('');
  return `<table>
    <thead><tr><th>Día</th><th>Horario</th><th>Sede</th><th>Box</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function search() {
  const q = normalize(input.value);
  if (!q) {
    results.innerHTML = '<div class="empty">Ingrese un nombre o apellido para consultar sus turnos.</div>';
    return;
  }
  const matches = DATA.filter(item => normalize(item.name).includes(q));
  if (!matches.length) {
    results.innerHTML = '<div class="empty">No se encontraron turnos para esa búsqueda.</div>';
    return;
  }
  results.innerHTML = matches.map(item => `
    <article class="card">
      <h2>${escapeHtml(item.name)}</h2>
      ${table(item.turnos)}
    </article>
  `).join('');
}

button.addEventListener('click', search);
input.addEventListener('input', search);
input.addEventListener('keydown', event => {
  if (event.key === 'Enter') search();
});
results.innerHTML = '<div class="empty">Ingrese un nombre o apellido para consultar sus turnos.</div>';
</script>
